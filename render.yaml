services:
  - type: web
    name: employee-attendance
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: DATABASE_URL
        sync: false   # paste the Supabase Session pooler URL in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
